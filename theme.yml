theme:
  url: projekt0n/github-nvim-theme
  name: github-theme
  variant: github_dark_default
  options:
    styles:
      comments: italic
  groups:
    all:
      # Inline code in markdown: regular (non-italic) red on dark grey.
      "@markup.raw.markdown_inline":
        fg: "#ff7b72"
        bg: "#2e2e2e"
      # render-markdown's own inline-code layer, pinned to the same colors.
      RenderMarkdownCodeInline:
        fg: "#ff7b72"
        bg: "#2e2e2e"
      # Harper grammar diagnostics: dark-red wavy underline, scoped to Harper's
      # namespace by plugins/lsp.lua so it never recolors other servers' hints.
      # (undercurl needs terminal support; degrades to a flat dark-red underline.)
      HarperDiagnosticUnderline:
        sp: "#8b0000"
        style: undercurl
      # Vale prose-style diagnostics: violet wavy underline, scoped to Vale's
      # namespace the same way. Vale reports error/warning/suggestion severities,
      # so without this a wordiness nit draws the same red squiggle as a compile
      # error. Distinct from Harper's red so the two prose sources are tellable
      # apart at a glance (markdownlint is the dark-yellow line band).
      ValeDiagnosticUnderline:
        sp: "#8250df"
        style: undercurl

