name: Download Release Package
description: Downloads the release tarball and notes built by the package job.

inputs:
  path:
    description: Directory to extract the downloaded artifact into
    required: false
    default: artifact

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-package
        path: ${{ inputs.path }}
