name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default; the publish-release job below overrides with contents: write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale pull-request runs, but never cancel a push to main: that run
  # ends in publish-release, and cancelling it can leave a release half done.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # mise.toml's Lua 5.1 is compiled from source and links readline and
      # ncurses, whose headers the Ubuntu runner image lacks. Only a mise cache
      # miss needs them, but the step is too cheap to be worth skipping on a hit.
      - name: Install Lua build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev libncurses-dev

      # Installs everything in mise.toml rather than a per-job subset, so no
      # job's tool list can drift from it.
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Lint
        run: task lint

  unit-test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # See the lint job.
      - name: Install Lua build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev libncurses-dev

      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Unit tests
        run: task test:unit

  # tests/integration/ runs real Busted inside a fully-loaded headless Neovim
  # (see .busted's `integration` task and scripts/busted-nvim.sh), on mise.toml's
  # Lua 5.1 (its comment says why it must be 5.1). mise-action exports the
  # BUSTED_ROCKS_TREE the shim loads busted from.
  integration-test:
    name: Integration Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # See the lint job.
      - name: Install Lua build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev libncurses-dev

      # Includes markdownlint-cli2, which the lint spec's functional path needs;
      # the last step hides it again to cover the missing-binary guard path.
      - name: Install tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      # The suite loads the real config: stdpath("config") must resolve to
      # this checkout, and the lazy-lock.json plugins must exist on disk.
      - name: Link repo as Neovim config and install plugins
        run: |
          mkdir -p "$HOME/.config"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.config/nvim"
          task install

      - name: Integration tests
        run: task test:integration

      # The guard path only compiles when the binary is missing — hide it and
      # re-run the lint spec so both branches stay covered (one OS is enough).
      - name: Integration tests (missing-binary guard path)
        if: runner.os == 'Linux'
        run: scripts/test-without-binary.sh markdownlint-cli2 -- busted --run=integration tests/integration/markdown_lint_spec.lua

  # Builds the release artifact on every green push to main. The tag is CalVer
  # (YYYY.MM.DD in UTC) with a same-day counter suffix (2026.07.19, then
  # 2026.07.19.1, ...). The artifact ships only what .nvimignore permits.
  # Packaging is split from publishing (see verify-release, publish-release below)
  # so a broken artifact can be caught before it's ever attached to a release.
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, unit-test, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'renovate[bot]'
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.package.outputs.artifact }}
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine CalVer version
        id: version
        run: |
          base="$(date -u +%Y.%m.%d)"
          latest="$(git tag --list "$base" "$base.*" --sort=-version:refname | head -n 1)"

          if [[ -z "$latest" ]]; then
            version="$base"
          elif [[ "$latest" == "$base" ]]; then
            version="$base.1"
          else
            version="$base.$(( ${latest##*.} + 1 ))"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The new tag isn't created yet, so the most recent existing tag is
          # the previous release. GitHub's --generate-notes only lists merged
          # PRs, so it comes up empty for commits pushed straight to main;
          # build notes from the commit log instead.
          prev="$(git tag --list --sort=-version:refname | head -n 1)"

          if [[ -n "$prev" ]]; then
            range="${prev}..${GITHUB_SHA}"
            compare_base="$prev"
          else
            range="$GITHUB_SHA"
            compare_base=""
          fi

          notes="release-notes.md"
          {
            echo "## Changes"
            echo
            git log --no-merges --reverse --pretty=format:'- %s (%h)' "$range"
            echo
            echo
            if [[ -n "$compare_base" ]]; then
              echo "**Full changelog:** ${SERVER_URL}/${REPOSITORY}/compare/${compare_base}...${VERSION}"
            fi
          } > "$notes"

          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          cat "$notes"

      - name: Package artifact
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          rsync -a --filter='merge .nvimignore' ./ "$stage/"

          # Stamp the release into the staged copy only; the repository keeps the
          # "dev" placeholder. `:Update` (lua/config/updater.lua) compares this
          # against the latest tag, and refuses an archive whose stamp disagrees
          # with the tag it downloaded.
          printf 'return { version = "%s" }\n' "$VERSION" > "$stage/lua/config/version.lua"

          # The name is deliberately version-agnostic: it lets scripts/install.sh
          # download from releases/latest/download/ instead of resolving the asset
          # through the REST API, whose unauthenticated rate limit is charged to
          # the caller's IP address and answers 403 once drained. The release tag
          # already carries the version, and it stays in the URL path for pinned
          # downloads. Renaming this means renaming ASSET in scripts/install.sh.
          artifact="nvim-config.tar.gz"
          tar -czf "$artifact" -C "$stage" .

          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          tar -tzf "$artifact"

      - name: Upload release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.notes.outputs.notes }}
          retention-days: 1

  # Proves the packaged artifact actually boots before it's published: installs a
  # pinned Neovim, points it at the *extracted artifact* (not the full checkout) as
  # its config dir, and lets lazy.nvim install plugins. This is what catches an
  # .nvimignore that silently dropped a lua/ file some other module require()s.
  verify-release:
    name: Verify Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [package]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Cone mode always checks out root-level files, so mise.toml comes along.
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Download release package
        uses: ./.github/actions/download-release-package # zizmor: ignore[self-repository] local composite action in this repo, not a third-party ref

      - name: Install Neovim
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: neovim

      - name: Extract artifact as Neovim config
        env:
          ARTIFACT: ${{ needs.package.outputs.artifact }}
        run: |
          config="$RUNNER_TEMP/nvim-config"
          mkdir -p "$config"
          tar -xzf "artifact/${ARTIFACT}" -C "$config"
          mkdir -p "$HOME/.config"
          ln -sfn "$config" "$HOME/.config/nvim"

      - name: Check version stamp
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          stamp="$RUNNER_TEMP/nvim-config/lua/config/version.lua"
          cat "$stamp"
          if ! grep -qF "\"$VERSION\"" "$stamp"; then
            echo "::error::lua/config/version.lua in the artifact does not carry $VERSION"
            exit 1
          fi

      - name: Smoke-test install
        run: |
          log="$RUNNER_TEMP/nvim-smoke.log"
          nvim --headless "+Lazy! install" +qa > "$log" 2>&1
          status=$?
          cat "$log"

          if [[ $status -ne 0 ]] || grep -q "Error detected while processing" "$log"; then
            echo "::error::Neovim failed to load the packaged release artifact as a config"
            exit 1
          fi

  # Publishes a GitHub release once the artifact has passed verify-release.
  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [package, verify-release]
    permissions:
      contents: write # Needed to create the GitHub release and push its tag
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Download release package
        uses: ./.github/actions/download-release-package # zizmor: ignore[self-repository] local composite action in this repo, not a third-party ref

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
          ARTIFACT: artifact/${{ needs.package.outputs.artifact }}
          NOTES: artifact/${{ needs.package.outputs.notes }}
        run: |
          gh release create "$VERSION" "$ARTIFACT" \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file "$NOTES"

      - name: Write release summary
        env:
          VERSION: ${{ needs.package.outputs.version }}
          ARTIFACT: artifact/${{ needs.package.outputs.artifact }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo "## Release $VERSION"
            echo
            echo "- **Tag:** \`$VERSION\`"
            echo "- **Artifact:** \`$(basename "$ARTIFACT")\` ($(du -h "$ARTIFACT" | cut -f1))"
            echo "- **Release:** ${SERVER_URL}/${REPOSITORY}/releases/tag/$VERSION"
            echo
            echo "<details><summary>Artifact contents</summary>"
            echo
            echo '```text'
            tar -tzf "$ARTIFACT"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
