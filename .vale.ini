; Vale prose style linting, read by vale-ls. This file is the fallback config:
; lua/config/lsp_servers.lua passes it as `configPath` so Vale has something to
; work with in every prose buffer (Obsidian notes, scratch repos), the way
; harper-ls needs no setup at all. A project shipping its own .vale.ini always
; wins -- vale_ls's before_init drops this one whenever a root_dir resolves.
;
; Run `:ValeSync` (or `task vale:sync`) once to download the packages below into
; StylesPath. Until that directory exists this file is withheld entirely, since
; Vale aborts with E201 on every lint while a declared StylesPath is missing.

StylesPath = vale-styles
MinAlertLevel = suggestion
Packages = write-good, proselint

[*.md]
BasedOnStyles = write-good, proselint

; Harper owns spelling and repeated words already (SpellCheck / RepeatedWords in
; config.yml); leaving the equivalents on double-flags every typo with two
; underlines and two sets of code actions.
Vale.Spelling = NO
Vale.Repetition = NO
write-good.Illusions = NO

; E-Prime flags every occurrence of "is"/"are" -- a whole-document underline, not
; a lint. Off by default; turn it on for deliberate E-Prime writing.
write-good.E-Prime = NO
