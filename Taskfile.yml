# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  CI:
    sh: "[[ -n $CI ]] && echo true || echo false"

tasks:

  tools:
    desc: Install the development tools pinned in mise.toml
    # jdx/mise-action owns tool installs in CI (.github/workflows/ci.yml).
    if: '{{ eq .CI "false" }}'
    cmd: mise install

  hooks:
    if: '{{ eq .CI "false" }}'
    sources:
      - lefthook.yml
    generates:
      - .git/hooks/pre-commit
      - .git/hooks/pre-push
    cmd: lefthook install

  install:
    desc: Install development tools and LazyVim plugins
    # `deps`, not a cmd: Task runs deps before the `sources` up-to-date check,
    # so the tools stay in sync even when lazy-lock.json is unchanged.
    deps:
      - task: tools
    sources:
      - lazy-lock.json
    cmds:
      - task: hooks
      - nvim --headless "+Lazy! install" +qa

  vale:sync:
    desc: Download the Vale style packages declared in .vale.ini
    # The developer-clone equivalent of the Vale step in scripts/install.sh.
    # Deliberately outside `install`, which syncs mise.toml's dev tools and
    # fetches plugins but never downloads editor-side packages (the headless
    # guard in plugins/lsp.lua).
    sources:
      - .vale.ini
    cmd: vale --config .vale.ini sync

  update:
    desc: Update LazyVim plugins
    generates:
      - lazy-lock.json
    ignore_error: true
    cmds:
      - nvim --headless "+Lazy! update" +qa
      - git add lazy-lock.json
      - "git commit -m 'chore: update plugins'"

  lint:
    desc: Lint codebase
    deps:
      - task: lint:lua
      - task: lint:md
      - task: lint:shell
      - task: lint:ci

  format:
    desc: Format codebase
    deps:
      - task: format:lua
      - task: format:md

  test:
    desc: Run full test pipeline
    cmds:
      - task: test:unit
      - task: test:integration
      - task: test:package

  lint:lua:
    desc: Lint Lua sources and tests
    sources:
      - ./**/*.lua
    cmds:
      - stylua --check {{ .CLI_ARGS | default "." }}
      - selene {{ .CLI_ARGS | default "." }}

  lint:md:
    desc: Lint Markdown files
    sources:
      - ./**/*.md
    # "!vale-styles/**" excludes the third-party style packages `task vale:sync`
    # downloads; their READMEs are not ours to lint or fix.
    cmd: markdownlint-cli2 {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}"**/*.md" "!vale-styles/**"{{end}}

  lint:shell:
    desc: Lint Shell scripts
    sources:
      - ./**/*.sh
    cmd: '{{if .CLI_ARGS}}shellcheck {{ .CLI_ARGS }}{{else}}find . -type f -name "*.sh" -exec shellcheck {} +{{end}}'

  lint:ci:
    desc: Lint GitHub Actions workflows
    sources:
      - .github/**/*.yml
    cmds:
      - task: actionlint
      - task: zizmor

  actionlint:
    desc: Run jactionlint, the maintained actionlint fork
    cmd: jactionlint

  zizmor:
    desc: Run zizmor
    # Online audits use $GITHUB_TOKEN (set in CI) or the gh CLI's token. With
    # neither, the variable must be unset, not empty: zizmor then runs its
    # offline audits, while an empty token is a hard error.
    cmd: |
      token="${GITHUB_TOKEN:-$(gh auth token 2>/dev/null || true)}"
      if [ -n "$token" ]; then export GITHUB_TOKEN="$token"; else unset GITHUB_TOKEN; fi
      zizmor --persona auditor .

  format:lua:
    desc: Format Lua sources and tests
    sources:
      - ./**/*.lua
    cmd: stylua {{ .CLI_ARGS | default "." }}

  format:md:
    desc: Fix auto-fixable Markdown lint issues
    sources:
      - ./**/*.md
    cmd: markdownlint-cli2 --fix {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}"**/*.md" "!vale-styles/**"{{end}}

  test:package:
    desc: Verify the release tarball's contents against the .nvimignore allowlist
    cmd: scripts/verify-package.sh

  test:unit:
    desc: Run unit tests
    cmd: busted --run=unit {{ .CLI_ARGS | default "" }}

  test:integration:
    desc: Run integration tests
    # Fails the run if a spec changed the working tree -- some plugins under
    # test write files (grug-far's Replace), and an unconfined spec rewrites
    # this repository. See scripts/guard-worktree.sh.
    cmd: scripts/guard-worktree.sh -- busted --run=integration {{ .CLI_ARGS | default "" }}
