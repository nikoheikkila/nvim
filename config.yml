config:
  # Obsidian vault (obsidian.nvim). See docs/obsidian.md.
  obsidian:
    # Vault root
    vault: "$HOME/Vaults"
    # Daily notes (`:Obsidian today`, Space n d). `folder` is relative to the
    # vault root; `dateFormat` is a Moment.js pattern, and a "/" in it creates
    # subdirectories (e.g. "YYYY/MM/DD" -> folder/2026/07/28.md).
    dailyNotes:
      folder: "000 - Inbox/Journal"
      dateFormat: "YYYY-MM-DD"
  # Harper grammar/spell checker (harper-ls). See docs for the full option list:
  # https://writewithharper.com/docs/integrations/neovim
  harper:
    # dialect: American | British | Australian | Canadian | Indian
    dialect: "British"
    # diagnosticSeverity: hint | information | warning | error
    diagnosticSeverity: "hint"
    isolateEnglish: false
    maxFileLength: 120000
    # Dictionary/ignore paths: empty means "use harper's default location", which
    # for the user dictionary is ~/Library/Application Support/harper-ls/
    # dictionary.txt on macOS and $XDG_CONFIG_HOME/harper-ls/dictionary.txt on
    # Linux, and .harper-dictionary.txt in the project root for the workspace one.
    # `:HarperDict` / `:HarperDict project` open those two for editing.
    # userDictPath and workspaceDictPath name a FILE; fileDictPath and
    # ignoredLintsPath name a DIRECTORY. "~", "$VARS", and paths relative to the
    # project root all work.
    userDictPath: ""
    workspaceDictPath: ""
    fileDictPath: ""
    ignoredLintsPath: ""
    # excludePatterns: uncomment to add glob patterns (block sequence, one per
    # line). Omitting it leaves harper on its default.
    # excludePatterns:
    #   - "node_modules/**"
    #   - "*.min.js"
    codeActions:
      ForceStable: false
    markdown:
      IgnoreLinkTitle: false
    linters:
      SpellCheck: true
      SpelledNumbers: false
      AnA: true
      SentenceCapitalization: true
      UnclosedQuotes: true
      WrongApostrophe: false
      LongSentences: true
      RepeatedWords: true
      Spaces: true
      CorrectNumberSuffix: true
  # Vale prose style linter (vale-ls). Complements Harper: Harper owns grammar
  # and spelling, Vale owns style — wordiness, weasel words, passive voice,
  # clichés. Which rules run is decided by `.vale.ini`, not here; `:ValeConfig`
  # opens it and `:ValeSync` downloads the packages it declares. Option list:
  # https://docs.vale.sh/guides/lsp
  vale:
    # configPath: which .vale.ini to lint against. Empty means "the one shipped
    # next to this file", which is what makes Vale work in buffers belonging to
    # no project (Obsidian notes, scratch files). A project with its own
    # .vale.ini always wins regardless. "~", "$VARS", and paths relative to the
    # project root all work. Delete the shipped .vale.ini to opt out entirely
    # and hand config discovery back to Vale.
    configPath: ""
    # lintOnChange: diagnostics as you type. Off means on open and save only.
    lintOnChange: true
    # debounceMs: how long typing has to settle before a lint runs. Each lint
    # spawns a Vale process, so lower is not automatically better.
    debounceMs: 300
    # filter: a Vale expression narrowing what is reported, e.g.
    # ".Level in ['warning', 'error']" to drop suggestion-level alerts. Empty
    # reports everything `.vale.ini`'s MinAlertLevel allows.
    filter: ""
    # valeBinaryPath: an absolute path to a specific `vale`. Empty takes it from
    # PATH, where mason puts the copy it installs. Note vale-ls does NOT fall
    # back to PATH when a path set here does not exist.
    valeBinaryPath: ""
    # installVale: let vale-ls download and manage its own Vale into a vale_bin/
    # folder. Off because mason already installs the CLI.
    installVale: false
    # syncOnStartup: run `vale sync` every time the server starts. Off — that is
    # a network fetch on every session; `:ValeSync` is the on-demand version.
    syncOnStartup: false
    # showMetrics: a word/sentence-count code lens. Inert until something calls
    # vim.lsp.codelens.refresh(); nothing here does.
    showMetrics: true
